# Turns on plain-English summaries for a new NWS office.
# The weather app's "Turn on summaries" button opens a prefilled issue titled "Enable summaries: <OFFICE>";
# when the repo owner submits it, this adds the office to config.json, saves its discussion, and closes the issue.
name: Turn on summaries for an office

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      office:
        description: 'NWS office ID (e.g. SEW)'
        required: true
      location:
        description: 'Place to focus on (e.g. Sequim, WA)'
        required: false
      coords:
        description: 'Coordinates of that place (e.g. 48.08, -123.10)'
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: enable-summaries
  cancel-in-progress: false

jobs:
  enable:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.issue.title, 'Enable summaries') && github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Add the office to config.json and save its discussion
        id: add
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          INPUT_OFFICE: ${{ inputs.office }}
          INPUT_LOCATION: ${{ inputs.location }}
          INPUT_COORDS: ${{ inputs.coords }}
        run: python3 scripts/enable_office.py
      - name: Commit
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          INPUT_OFFICE: ${{ inputs.office }}
          INPUT_LOCATION: ${{ inputs.location }}
          INPUT_COORDS: ${{ inputs.coords }}
        run: scripts/commit.sh "Turn on summaries for ${{ steps.add.outputs.office }} (${{ steps.add.outputs.name }})" "python3 scripts/enable_office.py"
      - name: Close the request
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          OFFICE: ${{ steps.add.outputs.office }}
          STATUS: ${{ steps.add.outputs.status }}
        run: |
          if [ "$STATUS" = already ]; then note="Summaries were already on for $OFFICE."; else note="Done — summaries are on for $OFFICE. The first plain-English summary appears in the app within about an hour."; fi
          gh issue close "$NUM" -R "$GITHUB_REPOSITORY" --comment "$note"
      - name: Report a failure on the request
        if: failure() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$NUM" -R "$GITHUB_REPOSITORY" --body "Couldn't turn on summaries automatically. Details: $RUN"
